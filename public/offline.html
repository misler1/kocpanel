<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bağlantı yok | KoçDefterim</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F7F6FC; color: #1F1B2E; }
    .card { max-width: 360px; text-align: center; background: #fff; border: 1px solid #E8E5F1; border-radius: 24px; padding: 32px 24px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #6B6680; margin: 0 0 22px; }
    button { border: 0; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #8B5CF6, #EC4899); cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="KoçDefterim">
    <h1>İnternet bağlantısı yok</h1>
    <p>Bağlantın geri geldiğinde KoçDefterim kaldığın yerden açılacak.</p>
    <button type="button" onclick="location.reload()">Tekrar dene</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
